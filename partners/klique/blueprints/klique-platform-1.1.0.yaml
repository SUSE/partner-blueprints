# Klique Platform for SUSE AI Factory. Maintained by Klique (klique.ai).
# Replace the example.com hostnames and the two CHANGE-ME passwords before
# installing; see spec.description for prerequisites.
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  name: klique-platform-1-1-0
  labels:
    ai-factory.suse.com/blueprint-name: klique-platform
    ai-factory.suse.com/blueprint-version: 1.1.0
spec:
  source: Partner
  displayName: Klique Platform
  version: 1.1.0
  description: |
    Klique AI platform: one control plane for GPU compute and LLM tokens.
    Installs the Klique control plane, the Kubernetes orchestrator, the AI
    gateway and the management console, with optional GPU-sharing components.
    Users launch sessions, jobs, model endpoints and apps from the Klique web
    UI, SDK, CLI or MCP server, under quotas and budgets, without cluster
    access.

    COMPONENTS (untick any you do not want in the install wizard)
      control-plane               API server, web UI, file server, MongoDB,
                                  Valkey, Elasticsearch and the platform
                                  management server
      orchestrator                runs queued tasks as pods
      gateway                     AI gateway: application routes and the LLM
                                  gateway
      platform-management-center  management console web UI (needs the
                                  platform management server in
                                  control-plane)
      gpu-operator                NVIDIA GPU Operator, configured for GPU
                                  sharing
      fractional-gpu-injector     fractions of any NVIDIA GPU by time-slicing
      dynamic-mig-operator        MIG partitions on MIG-capable GPUs
    GPU sharing is a choice: keep ONE of fractional-gpu-injector and
    dynamic-mig-operator ticked, never both, or untick both for whole GPUs.

    REPLACE BEFORE INSTALLING
      - every *.example.com hostname (web UI, API, files, gateway, console)
      - both <CHANGE-ME-...> passwords: the Klique admin user in
        control-plane apiserver.additionalConfigs, and the console admin user
        in control-plane platformManagementServer.additionalConfigs. Or
        replace the fixed_users blocks with your own users or SSO.
      - the TLS secret name klique-demo-tls if you use a different one

    EXPOSED ENDPOINTS (Ingress, default IngressClass, TLS)
      klique-app.example.com      web UI
      klique-api.example.com      API (SDK and CLI)
      klique-files.example.com    file server
      klique-gateway.example.com  AI gateway; application routes also use
                                  *.klique-gateway.example.com
      klique-pmc.example.com      management console

    PREREQUISITES
      A default StorageClass (about 120 GiB of persistent volumes), an
      ingress controller, DNS for the hostnames above, and the "nvidia"
      ClusterRepo (https://helm.ngc.nvidia.com/nvidia) if gpu-operator is
      included. Klique charts and images come from an authenticated
      registry; credentials are issued by Klique with a subscription.
      Steps 1-2 are one-time cluster setup. Steps 3-5 are per install, in
      the namespace this blueprint installs into, and run BEFORE installing.

      1) Chart-repo credential: Secret "klique-helm-auth" in cattle-system.
         It only downloads Helm charts from oci://docker.io/kliqueai.

         kubectl -n cattle-system create secret generic klique-helm-auth \
           --type=kubernetes.io/basic-auth \
           --from-literal=username="<chart-repo-user>" \
           --from-literal=password="<chart-repo-token>"

      2) The "klique" ClusterRepo:

         apiVersion: catalog.cattle.io/v1
         kind: ClusterRepo
         metadata:
           name: klique
         spec:
           url: oci://docker.io/kliqueai
           clientSecret:
             name: klique-helm-auth
             namespace: cattle-system

      3) Image pull secret "klique-registry-pull" in the target namespace,
         from your own registry credentials for the Klique images. It must
         also exist in the gpu-operator, cfgi and cdmo namespaces if those
         components are included.

         kubectl -n <namespace> create secret docker-registry \
           klique-registry-pull --docker-server=docker.io \
           --docker-username="<user>" --docker-password="<token>"

      4) Secret "klique-orchestrator-credentials" in the target namespace,
         with random values you generate. The API server registers this pair
         at startup; the orchestrator and the gateway present the same pair.
         Keys: orchestratork8sglue_key, orchestratork8sglue_secret and
         clearml.conf (the SDK config pointing at the in-cluster services).

         cat > /tmp/klique-clearml.conf <<EOF
         api {
           api_server: "http://control-plane-apiserver:8008"
           web_server: "http://control-plane-webserver:8080"
           files_server: "http://control-plane-fileserver:8081"
         }
         EOF
         kubectl -n <namespace> create secret generic \
           klique-orchestrator-credentials \
           --from-literal=orchestratork8sglue_key="$(openssl rand -hex 16)" \
           --from-literal=orchestratork8sglue_secret="$(openssl rand -hex 32)" \
           --from-file=clearml.conf=/tmp/klique-clearml.conf

      5) A TLS secret (default name klique-demo-tls) in the target namespace
         for the ingress hostnames.

    GPU COMPONENTS - READ BEFORE LEAVING THEM TICKED
      - Raise the inotify instance limit on GPU nodes before installing,
        for example: sysctl -w fs.inotify.max_user_instances=8192 (and
        persist it). At the kernel default of 128 the device plugin can fail
        with "failed to create FS watcher ... too many open files".
      - gpu-operator assumes the NVIDIA driver and container toolkit are
        installed on the host (driver.enabled=false, toolkit.enabled=false).
        With a host-installed toolkit, set these in
        /etc/nvidia-container-runtime/config.toml on every GPU node:
          accept-nvidia-visible-devices-envvar-when-unprivileged = false
          accept-nvidia-visible-devices-as-volume-mounts = true
        If the operator manages the toolkit instead, set toolkit.enabled=true
        and pass the equivalent toolkit.env values.
      - If a gpu-operator release already exists on the cluster, untick this
        component and apply the same values to the existing release.
      - Nothing changes on a node until it is labelled. Label the GPU nodes
        to match the ONE option you kept ticked:
          kubectl label node <node> nvidia.com/device-plugin.config=ts
          kubectl label node <node> nvidia.com/device-plugin.config=mig
        ("ts" for fractional-gpu-injector, "mig" for dynamic-mig-operator.)
        MIG nodes also need MIG mode on each GPU (nvidia-smi -i <id> -mig 1)
        and: kubectl label node <node> cdmo.clear.ml/gpu-partitioning=mig
      - The "ts" config exposes GPU 0 only, as eight slices. Add one
        resources entry per GPU index.

    AFTER INSTALL - QUEUES (second pass)
      Create a resource pool and profiles in the Klique UI (Resource
      Configuration). Each profile-to-pool link creates a queue named
      resource_link_<UUID>. Add those names to the orchestrator values:
        orchestratork8sglue:
          queues:
            resource_link_<UUID-half>:
              templateOverrides:
                labels:
                  clearml-injector/fraction: "0.500"
            resource_link_<UUID-mig>:
              templateOverrides:
                resources:
                  limits:
                    nvidia.com/mig-3g.40gb: 1
      The first form is for fractional-gpu-injector, the second for
      dynamic-mig-operator (the MIG profile name varies by GPU).

    LICENSING
      Klique is commercial software. Charts and images require a Klique
      subscription; see https://klique.ai. The NVIDIA GPU Operator is
      subject to NVIDIA's license terms.
  components:
    - chartName: control-plane
      chartRepo: klique
      chartVersion: 1.1.2
      values:
        apiserver:
          additionalConfigs:
            apiserver.conf: |
              auth {
                fixed_users {
                  enabled: true
                  pass_hashed: false
                  users: [
                    {
                      username: "admin"
                      password: "<CHANGE-ME-klique-admin-password>"
                      name: "Administrator"
                      admin: true
                    }
                  ]
                }
              }
          cors:
            origins:
              - https://klique-app.example.com
          extraEnvs:
            - name: CLEARML__secure__credentials__agent__user_key
              valueFrom:
                secretKeyRef:
                  key: orchestratork8sglue_key
                  name: klique-orchestrator-credentials
            - name: CLEARML__secure__credentials__agent__user_secret
              valueFrom:
                secretKeyRef:
                  key: orchestratork8sglue_secret
                  name: klique-orchestrator-credentials
            - name: CLEARML__secure__credentials__agent__role
              value: admin
            - name: CLEARML__secure__credentials__agent__allow_login
              value: 'false'
          ingress:
            enabled: true
            hostName: klique-api.example.com
            ingressClassName: ''
            tlsSecretName: klique-demo-tls
        controlPlane:
          cookieSecure: true
        elasticsearch:
          image:
            pullSecrets:
              - klique-registry-pull
        fileserver:
          ingress:
            enabled: true
            hostName: klique-files.example.com
            ingressClassName: ''
            tlsSecretName: klique-demo-tls
        global:
          imagePullSecrets:
            - klique-registry-pull
        imageCredentials:
          enabled: true
          existingImagePullSecrets:
            - name: klique-registry-pull
          existingSecret: klique-registry-pull
        mongodb-kubernetes:
          registry:
            imagePullSecrets: klique-registry-pull
        valkey:
          image:
            pullSecrets:
              - klique-registry-pull
        webserver:
          ingress:
            enabled: true
            hostName: klique-app.example.com
            ingressClassName: ''
            tlsSecretName: klique-demo-tls
        platformManagementServer:
          enabled: true
          additionalConfigs:
            platform_server.conf: |
              auth {
                fixed_users {
                  enabled: true
                  users: [
                    {
                      username: "admin"
                      password: "<CHANGE-ME-pmc-admin-password>"
                      name: "PMC Administrator"
                    }
                  ]
                }
              }
    - chartName: orchestrator
      chartRepo: klique
      chartVersion: 1.0.1
      values:
        controlPlane:
          existingSecret: klique-orchestrator-credentials
        imageCredentials:
          enabled: true
          existingSecret: klique-registry-pull
        orchestratork8sglue:
          apiServerUrlReference: http://control-plane-apiserver:8008
          createQueues: true
          fileServerUrlReference: http://control-plane-fileserver:8081
          webServerUrlReference: http://control-plane-webserver:8080
    - chartName: gateway
      chartRepo: klique
      chartVersion: 1.0.0
      values:
        controlPlane:
          apiServerUrlReference: http://control-plane-apiserver:8008
          existingSecret: klique-orchestrator-credentials
          existingSecretKeys:
            apiKey: orchestratork8sglue_key
            apiSecret: orchestratork8sglue_secret
        imageCredentials:
          enabled: true
          existingImagePullSecrets:
            - name: klique-registry-pull
        ingress:
          enabled: true
          hostName: klique-gateway.example.com
          ingressClassName: ''
          tlsSecretName: klique-demo-tls
    - chartName: platform-management-center
      chartRepo: klique
      chartVersion: 1.0.0
      values:
        imageCredentials:
          existingImagePullSecrets:
            - name: klique-registry-pull
        proxy:
          upstream:
            url: http://control-plane-platform-management-server:5210
        webserver:
          ingress:
            enabled: true
            hostName: klique-pmc.example.com
            ingressClassName: ''
            tlsSecretName: klique-demo-tls
    - chartName: gpu-operator
      chartRepo: nvidia
      chartVersion: v26.7.1
      targetNamespace: gpu-operator
      values:
        driver:
          enabled: false
        toolkit:
          enabled: false
        migManager:
          enabled: false
        mig:
          strategy: mixed
        gfd:
          imagePullSecrets:
            - klique-registry-pull
        devicePlugin:
          repository: docker.io/clearml
          image: k8s-device-plugin
          version: v0.17.2-gpu-card-selection
          imagePullPolicy: Always
          imagePullSecrets:
            - klique-registry-pull
          env:
            - name: PASS_DEVICE_SPECS
              value: 'true'
            - name: FAIL_ON_INIT_ERROR
              value: 'true'
            - name: DEVICE_LIST_STRATEGY
              value: volume-mounts
            - name: DEVICE_ID_STRATEGY
              value: uuid
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          config:
            name: device-plugin-config
            create: true
            default: all-disabled
            data:
              all-disabled: |
                version: v1
                flags:
                  migStrategy: none
              ts: |
                version: v1
                flags:
                  migStrategy: none
                sharing:
                  timeSlicing:
                    renameByDefault: false
                    failRequestsGreaterThanOne: false
                    resources:
                    - name: nvidia.com/gpu
                      rename: nvidia.com/gpu-0
                      devices:
                      - "0"
                      replicas: 8
              mig: |
                version: v1
                flags:
                  migStrategy: mixed
    - chartName: fractional-gpu-injector
      chartRepo: klique
      chartVersion: 1.0.0
      releaseName: cfgi
      targetNamespace: cfgi
      values:
        imageCredentials:
          existingImagePullSecrets:
            - name: klique-registry-pull
    - chartName: dynamic-mig-operator
      chartRepo: klique
      chartVersion: 1.0.0
      targetNamespace: cdmo
      values:
        imageCredentials:
          existingImagePullSecrets:
            - name: klique-registry-pull
