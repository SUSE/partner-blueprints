# SUSE AI Factory blueprint, CPU variant of 8gcr-governed-model-chat: the
# same model supply chain (weights from 8gears Container Registry as a CNCF
# ModelPack OCI artifact, never from huggingface.co) on nodes without a GPU.
# It serves a small model so the whole path, Hugging Face -> 8gcr -> modctl ->
# vLLM -> Open WebUI, can be shown on a single CPU node. Not for production
# throughput; the GPU variant is 8gcr-governed-model-chat.
#
# The vLLM engine image is the upstream CPU build (vllm/vllm-openai-cpu),
# because SUSE Application Collection ships a CUDA vLLM image only.
#
# Per-install values to set in the install wizard (vllm-stack component):
#   servingEngineSpec.modelSpec[0].initContainer.args[-1]
#                       the model reference in your 8gcr
#   Secret 8gcr-model-pull (optional, see PREREQUISITES in the description)
#
# Charts: vllm-stack and open-webui from SUSE Application Collection.
# modctl: Apache-2.0, https://github.com/modelpack/modctl
# vLLM CPU image: Apache-2.0, https://github.com/vllm-project/vllm
---
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  name: 8gcr-governed-model-chat-cpu-0-1-0
  labels:
    ai-factory.suse.com/blueprint-name: 8gcr-governed-model-chat-cpu
    ai-factory.suse.com/blueprint-version: 0.1.0
    ai-factory.suse.com/category: platform
spec:
  source: Partner
  displayName: Governed Model Chat from 8gears Container Registry (vLLM, CPU)
  version: 0.1.0
  description: |
    CPU variant of "Governed Model Chat from 8gears Container Registry", for
    trying the setup on a node without a GPU. The model is pulled from your
    own 8gears Container Registry (8gcr, Harbor) as a CNCF ModelPack OCI
    artifact pinned to a Hugging Face commit. The cluster needs no access
    to huggingface.co.

    Default model: Qwen/Qwen3-0.6B (Apache-2.0, about 1.5 GB), served by the
    vLLM CPU build behind an OpenAI-compatible API, with Open WebUI as the
    chat UI. On a test node with 8 vCPUs the pod was ready 100 seconds
    after it started: 51 seconds to download the model, 47 seconds to start
    the engine. Short answers took a few seconds.

    PREREQUISITES
    1) An 8gcr 2.16.0 or later registry that the cluster can reach, holding:
       - the model, copied from Hugging Face by a pull replication rule
         with a Hugging Face endpoint as source (Administration >
         Replications) and "Also tag each copy with its source revision"
         on, which tags each copy sha-<12-char Hub commit>. Add a tag
         immutability rule for sha-* in that project so the tag cannot
         be moved.
       The modctl init container image is public:
       8gears.container-registry.com/library/modctl:v0.2.2 (amd64, arm64).
       For an air-gapped cluster, copy it into your 8gcr and change
       initContainer.registry and initContainer.image.
       Details:
       https://github.com/SUSE/partner-blueprints/blob/main/partners/8gears/README.md
    2) Point the blueprint at your registry: in this wizard, open the
       vllm-stack component's YAML and set the last initContainer argument
       (the model reference) to your 8gcr. It defaults to the placeholder
       harbor.example.com, which must be replaced.
    3) For private projects, create a pull Secret with a read-only 8gcr
       robot account in the namespace you choose in this wizard, before
       installing:
         kubectl -n <namespace> create secret docker-registry \
           8gcr-model-pull --docker-server=<registry-host> \
           --docker-username='<robot-name>' --docker-password='<robot-secret>'
       modctl uses it to pull the model, and the kubelet uses it for the
       modctl image if you copied that into a private project.
    4) An x86_64 node with about 5 free CPUs and 10Gi of free memory (engine
       4 CPU / 8Gi, plus router and Open WebUI), a default StorageClass and
       cert-manager. No GPU.

    Open WebUI is exposed through an Ingress at https://governed-chat-cpu;
    point DNS for "governed-chat-cpu" at the ingress controller.

    The registry controls cover the model supply chain only. Open WebUI
    lets anyone who reaches the Ingress sign up, and the vLLM API has no
    key; set ENABLE_SIGNUP=false and an API key before sharing the URL.
    Maintained and supported by 8gears (container-registry.com).

  components:
    - chartName: vllm-stack
      chartRepo: application-collection
      chartVersion: 0.1.13
      values:
        servingEngineSpec:
          # modctl runs as distroless nonroot (uid/gid 65532); without this
          # it cannot write to a freshly provisioned, root-owned PVC.
          securityContext:
            fsGroup: 65532
          # One model PVC (RWO) and usually one GPU per pod: a rolling update
          # would wait forever for a second GPU or a second volume attach.
          strategy:
            type: Recreate
          modelSpec:
            - name: qwen3-0-6b
              # Without registry the chart prefixes the cache-server registry.
              registry: docker.io
              repository: vllm/vllm-openai-cpu
              tag: v0.33.0
              # Local directory filled by the init container.
              modelURL: /data/models/qwen3-0-6b-c1899de289a0
              replicaCount: 1
              requestCPU: 4
              requestMemory: 8Gi
              requestGPU: 0
              # The chart defaults to runtimeClassName nvidia; empty drops it.
              runtimeClassName: ""
              pvcStorage: 5Gi
              # Lets the kubelet pull the modctl image if it is copied into a
              # private 8gcr project. Optional:
              # a missing Secret only produces a kubelet warning.
              imagePullSecret: 8gcr-model-pull
              env:
                # modelURL is a local path, so vLLM has no reason to call the
                # Hub; this makes any attempt fail loudly.
                - name: HF_HUB_OFFLINE
                  value: "1"
                # GiB of RAM for the KV cache on CPU.
                - name: VLLM_CPU_KVCACHE_SPACE
                  value: "2"
              vllmConfig:
                maxModelLen: 4096
                extraArgs:
                  - --served-model-name=qwen3-0-6b
                  # torch.compile took over 10 min on 4 CPUs; eager mode starts
                  # in under a minute.
                  - --enforce-eager
              initContainer:
                name: fetch-model
                # modctl v0.2.2 built from source with upstream build/Dockerfile
                # (CGO_ENABLED=0). The v0.2.2 release binary is glibc-static and
                # panics resolving uid 65532 in distroless, and v0.2.2 predates
                # the upstream image at ghcr.io/modelpack/modctl.
                # SUSE Application Collection chart: registry, image and tag are
                # separate fields (upstream vllm-stack takes one image string).
                registry: 8gears.container-registry.com
                image: library/modctl
                tag: v0.2.2
                args:
                  - pull
                  - --extract-from-remote
                  - --extract-dir=/data/models/qwen3-0-6b-c1899de289a0
                  # Revision tag for Hub commit c1899de289a0. The directory
                  # above carries the same revision, so a new revision never
                  # mixes with files of the old one.
                  - harbor.example.com/models/qwen/qwen3-0.6b:sha-c1899de289a0
                mountPvcStorage: true
                env:
                  - name: DOCKER_CONFIG
                    value: /etc/8gcr
                extraVolumeMounts:
                  - name: model-pull-secret
                    mountPath: /etc/8gcr
                    readOnly: true
              # vLLM needs more /dev/shm than the 64 MiB container default; the
              # chart mounts one only when tensorParallelSize is set.
              extraVolumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              extraVolumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 1Gi
                - name: model-pull-secret
                  secret:
                    secretName: 8gcr-model-pull
                    # Public projects need no credentials.
                    optional: true
                    items:
                      - key: .dockerconfigjson
                        path: config.json
        routerSpec:
          enableRouter: true
          routingLogic: roundrobin
          startupProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
            httpGet:
              path: /health
              port: router-port
    - chartName: open-webui
      chartRepo: application-collection
      chartVersion: 8.19.1
      values:
        global:
          tls:
            source: suse-private-ai
            issuerName: suse-private-ai
        image:
          registry: dp.apps.rancher.io
          repository: containers/open-webui
          tag: 0.6.41-15.2
        ollama:
          enabled: false
        enableOpenaiApi: true
        openaiBaseApiUrl: http://vllm-stack-router-service/v1
        openaiApiKey: dummy
        extraEnvVars:
          - name: DEFAULT_USER_ROLE
            value: user
          - name: ENABLE_SIGNUP
            value: "true"
          - name: GLOBAL_LOG_LEVEL
            value: INFO
        persistence:
          enabled: true
          size: 20Gi
        ingress:
          enabled: true
          host: governed-chat-cpu
          tls: true
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
