# Tensormesh Platform on SUSE AI (vLLM) — adds Tensormesh Platform's KV cache to
# the SUSE AI open vLLM serving stack.
#
# TWO-TIER design. The cache is wired into vLLM by a pod-mutating admission
# webhook that the Tensormesh operator registers. That webhook, by design, does
# NOT mutate pods in its own release namespace, so the operator+webhook cannot
# live in the same namespace as the vLLM pod it must inject. Therefore:
#
#   Tier 1 (cluster prerequisite, installed once, in its own namespace):
#     tensormesh-platform with operator+webhook+CRDs, engine disabled.
#
#   Tier 2 (this Blueprint, deployed per AIWorkload into a workload namespace):
#     - an LMCacheEngine CR (engine-only render; operator/webhook/CRDs off) so a
#       cache server runs in the workload namespace, and
#     - the vLLM serving stack, its pod labelled lmcache.ai/lmcache-inject=true.
#     The workload namespace differs from the operator's, so the webhook injects
#     the vLLM pod and resolves the engine in the same (workload) namespace.
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  name: tensormesh-suse-ai-1-0-0
  labels:
    ai-factory.suse.com/blueprint-name: tensormesh-suse-ai
    ai-factory.suse.com/blueprint-version: 1.0.0
spec:
  source: Partner
  displayName: Tensormesh Platform on SUSE AI (vLLM)
  version: 1.0.0
  description: |-
    Runs the SUSE AI open vLLM serving stack (serving engine + router) with
    Tensormesh Platform's KV cache enabled, so repeated prompt context is reused
    across requests instead of recomputed on the GPU.

    How the cache attaches: this Blueprint wires the vLLM serving pod to the
    cache directly in Helm values (no admission webhook). It appends
    --kv-transfer-config to the vLLM command and supplies its value from the
    LMCacheEngine's <engine>-connection ConfigMap through an environment variable
    (Kubernetes expands $(VAR) references inside command/args). The vLLM image
    must contain LMCache so that flag loads the MP connector module. The vLLM
    chart's own optional LMCache (lmcacheConfig) is left OFF so the single cache
    is provided by Tensormesh Platform. Engine and vLLM run in the same (workload)
    namespace, so the ConfigMap reference (which is namespace-local) resolves.

    Prerequisites:
      - The SUSE AI Factory operator (blueprints.ai-factory.suse.com).
      - The Tensormesh Platform operator + webhook + CRDs installed cluster-wide
        in their own namespace, with the engine disabled (Tier 1).
      - cert-manager (the Tier-1 operator ships a webhook needing a serving
        certificate; this Blueprint does not rely on webhook injection).
      - Two Rancher ClusterRepos: the SUSE Application Collection (with pull
        credentials) and the tensormesh ClusterRepo (the tensormesh-platform
        chart source).
      - A default StorageClass (for the model PVC) and a node with an NVIDIA GPU
        plus the GPU Operator / device plugin.
      - A RuntimeClass named `nvidia`. The SUSE AI Factory GPU operator creates
        `nvidia-experimental` instead, so add a `nvidia` RuntimeClass pointing at
        the same containerd handler (otherwise the engine DaemonSet is rejected).
      - The AIWorkload (workload) namespace labelled
        pod-security.kubernetes.io/enforce=privileged — the engine runs privileged
        with a hostPath /dev/shm mount for CUDA IPC, which the baseline/restricted
        PSA would reject.

    Licensing: the LMCache operator and engine container images are the public
    open-source lmcache/* images; the tensormesh-platform Helm chart and premium
    plugins ship via the Tensormesh Key Distribution gateway. This is a
    community / integration blueprint, not a SUSE-supported product.
  components:

  # ------------------------------------------------------------------ #
  # Tier 2a. LMCacheEngine — a per-GPU-node cache server in THIS namespace.
  # Engine-only render: the operator, webhook and CRDs come from the Tier-1
  # cluster prerequisite, so they are disabled here. The cluster-wide operator
  # reconciles this CR into a cache-server DaemonSet in the workload namespace.
  # ------------------------------------------------------------------ #
  - chartName: tensormesh-platform
    chartRepo: tensormesh
    chartVersion: 1.0.0
    values:
      # Fixed name so the vLLM component below can reference this engine CR in its
      # lmcache-engine annotation, independent of the release name.
      fullnameOverride: tm-cache
      crds:
        enabled: false             # CRDs are installed once by the Tier-1 prerequisite
      operator:
        enabled: false             # operator runs cluster-wide (Tier 1), not per-workload
      webhook:
        enabled: false             # webhook belongs to the Tier-1 operator
      engine:
        enabled: true              # create an LMCacheEngine CR in this namespace
        spec:
          # Export the cache server's KV memory pool over cross-process CUDA IPC.
          # Required for offload on a shared GPU node (without it the engine fails
          # at KV registration).
          privileged: true
          # The engine cache server runs the OSS LMCache image. Its LMCache
          # version MUST match the vLLM image below, or the MP wire protocol will
          # not line up; v0.5.5 is the chart appVersion.
          image:
            repository: lmcache/vllm-openai
            tag: v0.5.5
          l1:
            # L1 KV-cache size — a host-RAM tier (not GPU). Raise for larger
            # working sets.
            sizeGB: 20
      coordinator:
        enabled: true              # fleet coordinator the engine registers with (same namespace)
        spec:
          image:
            repository: lmcache/vllm-openai
            tag: v0.5.5

  # ------------------------------------------------------------------ #
  # Tier 2b. vLLM serving — SUSE Application Collection "vLLM Production Stack"
  # (chart vllm-stack). The chart renders vLLM via `command: [vllm, serve, ...]`
  # and appends vllmConfig.extraArgs to it. The cache connection is wired here
  # in-values (not by a webhook): --kv-transfer-config is appended and its JSON is
  # read from the engine's <engine>-connection ConfigMap via an env var. The
  # chart's built-in LMCache is turned off so the single cache is Tensormesh's.
  # ------------------------------------------------------------------ #
  - chartName: vllm-stack
    chartRepo: application-collection
    chartVersion: 0.1.13
    values:
      servingEngineSpec:
        runtimeClassName: nvidia
        modelSpec:
          - name: qwen25-1-5b
            # The vLLM image must CONTAIN LMCache (the --kv-transfer-config flag
            # loads lmcache's MP connector module), and its LMCache version MUST match
            # the engine (v0.5.5) or the MP wire protocol will not line up. This image
            # bundles LMCache 0.5.5. Leaving registry/repository/tag empty selects the
            # same image (the chart's default serving image); pinned here to keep the
            # Blueprint explicit.
            registry: dp.apps.rancher.io
            repository: containers/lmcache-vllm-openai
            tag: "0.5.5-nvidia-1.1"
            modelURL: Qwen/Qwen2.5-1.5B-Instruct
            replicaCount: 1
            requestCPU: 6
            requestMemory: "16Gi"
            requestGPU: 1
            pvcStorage: "50Gi"
            # Supply the cache connection JSON to vLLM as an env var. The engine's
            # <engine>-connection ConfigMap (name derives from the Tier-2a
            # fullnameOverride tm-cache → tm-cache-default-engine) holds it under the
            # kv-transfer-config.json key. Must be in the same namespace
            # (configMapKeyRef is namespace-local). A wrong name/key fails the pod
            # loudly (CreateContainerConfigError) rather than starting without cache.
            env:
              - name: LMCACHE_KV_CONFIG
                valueFrom:
                  configMapKeyRef:
                    name: tm-cache-default-engine-connection
                    key: kv-transfer-config.json
            vllmConfig:
              # One GPU: a single tensor-parallel shard. The chart defaults this to 2,
              # which would require two GPUs.
              tensorParallelSize: 1
              # Serve the model generatively. The chart defaults to a pooling runner
              # that converts the model to embeddings (runner: pooling, convert: embed);
              # "auto" keeps it generative so chat/completions and the KV cache path
              # work (no --convert is emitted).
              runner: "auto"
              maxModelLen: 16384
              dtype: bfloat16
              # Leave GPU headroom for the cache buffer.
              gpuMemoryUtilization: 0.6
              # Force KV through LMCache, not vLLM's own prefix cache (required).
              enablePrefixCaching: false
              extraArgs:
                # Disable CUDA graphs so the KV pool is IPC-exportable; without it the
                # engine hits cudaErrorMapBufferObjectFailed.
                - "--enforce-eager"
                # Attach the Tensormesh cache: append --kv-transfer-config to the vLLM
                # command. Kubernetes expands $(LMCACHE_KV_CONFIG) from the env var
                # above, so the connector config comes from the engine ConfigMap.
                - "--kv-transfer-config"
                - "$(LMCACHE_KV_CONFIG)"
            # Turn the chart's built-in LMCache OFF so the single cache is provided by
            # Tensormesh Platform. The chart defaults this ON, which would add a second
            # --kv-transfer-config for an in-process connector and conflict.
            lmcacheConfig:
              enabled: false
      routerSpec:
        enableRouter: true
        serviceType: ClusterIP
        containerPort: 8000
        servicePort: 80
