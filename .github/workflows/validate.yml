name: Validate blueprints

on:
  pull_request:
    paths:
      - "partners/**"
      - "example/**"
      - "catalog.yaml"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

env:
  # Blueprint/BlueprintCatalog CRDs are fetched live from the operator repo so
  # validation always tracks the current, evolving schema. Pin CRD_REF to a tag
  # partners should target, or leave on main to validate against latest.
  CRD_REPO: SUSE/aif
  CRD_REF: main
  CRD_BLUEPRINT: charts/aif-operator/crds/ai-factory.suse.com_blueprints.yaml
  CRD_CATALOG: charts/aif-operator/crds/ai-factory.suse.com_blueprintcatalogs.yaml
  # Tools are pinned by version AND verified by checksum (see steps below).
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to immutable commit SHAs (tags are mutable). Comment = the
      # human-readable version each SHA corresponds to.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Python deps (pinned + hashed)
        run: pip install --require-hashes -r requirements.txt

      - name: Install kubeconform (checksum-verified)
        run: |
          curl -sSLf "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: yamllint
        run: yamllint partners example catalog.yaml

      - name: Fetch CRDs and build schemas
        run: |
          base="https://raw.githubusercontent.com/${CRD_REPO}/${CRD_REF}"
          curl -sSLf "$base/${CRD_BLUEPRINT}" -o crd-blueprint.yaml
          curl -sSLf "$base/${CRD_CATALOG}"   -o crd-catalog.yaml
          python scripts/crd2schema.py schemas crd-blueprint.yaml crd-catalog.yaml

      - name: kubeconform (CRD schema)
        id: kubeconform
        continue-on-error: true
        run: |
          find partners example catalog.yaml -name '*.yaml' -print0 \
            | xargs -0 kubeconform \
                -strict -summary \
                -schema-location 'schemas/{{ .ResourceKind | toLower }}_{{ .ResourceAPIVersion }}.json'

      - name: Convention checks
        id: conventions
        continue-on-error: true
        run: python scripts/catalog.py validate --summary summary.md

      - name: Catalog drift check
        id: drift
        continue-on-error: true
        run: python scripts/catalog.py gen --check

      - name: Label and comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;

            // Label by touched partner folder.
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number});
            const labels = new Set();
            for (const f of files) {
              const m = f.filename.match(/^partners\/([^/]+)\//);
              if (m) labels.add(`partner/${m[1]}`);
            }
            for (const name of labels) {
              try {
                await github.rest.issues.addLabels(
                  {owner, repo, issue_number: pull_number, labels: [name]});
              } catch (e) { core.warning(`label ${name}: ${e.message}`); }
            }

            // Upsert a validation summary comment.
            let summary = '_validation summary unavailable_';
            try { summary = fs.readFileSync('summary.md', 'utf8'); } catch (e) {}
            const marker = '<!-- blueprint-validation -->';
            const body = `${marker}\n## Blueprint validation\n\n${summary}`;
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number: pull_number});
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment(
                {owner, repo, issue_number: pull_number, body});
            }

      - name: Gate
        if: >
          steps.kubeconform.outcome == 'failure' ||
          steps.conventions.outcome == 'failure' ||
          steps.drift.outcome == 'failure'
        run: |
          echo "One or more validation steps failed. See logs and the PR comment."
          exit 1
